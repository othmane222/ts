# values.yaml (THE CORRECT AND FINAL VERSION)

# L'image ne change pas
torchserve_image: pytorch/torchserve:0.11.0-cpu

# ### THIS IS THE MOST IMPORTANT PART ###
torchserve:
  # --- On désactive les ports REST en les mettant à -1 ---
  management_port: -1
  inference_port: -1
  # --- On ajoute les ports gRPC par défaut ---
  grpc_management_port: 7071
  grpc_inference_port: 7070
  
  pvd_mount: /home/model-server/shared/
  n_gpu: 0
  n_cpu: 1
  memory_limit: 6Gi
  memory_request: 2Gi


# Settings for the Kubernetes Deployment object.
deployment:
  replicas: 2



# ### THIS IS THE OTHER MOST IMPORTANT PART ###
configmap:
  name: torchserve-configmap
  data:
    # --- Utiliser les ports gRPC ---
    grpc_inference_port: "7070"
    grpc_management_port: "7071"
    
    # --- Désactiver les ports REST ---
    inference_port: "-1"
    management_port: "-1"

    # Le reste de la configuration ne change pas
    model_store: /home/model-server/shared/model-store
    load_models: all
    install_py_dep_per_model: false
    default_workers_per_model: 1
    default_response_timeout: 120
    
    log_location: console
    log_level: DEBUG
    metrics_mode: log
    number_of_netty_threads: 4
    enable_envvars_config: true
pvc:
  name: efs-claim
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  storageRequest: 10Gi