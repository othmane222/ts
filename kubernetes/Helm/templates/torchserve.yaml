# torchserve.yml (Corrected Final Version)
---
apiVersion: v1
kind: Service
metadata:
  name: torchserve
  labels:
    app: torchserve
spec:
  type: NodePort
  ports:
  - name: preds
    port: {{ .Values.torchserve.inference_port }}
    targetPort: ts
  - name: mdl
    port: {{ .Values.torchserve.management_port }}
    targetPort: ts-management
    nodePort: 30176
  selector:
    app: torchserve
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: torchserve
  labels:
    app: torchserve
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: torchserve
  template:
    metadata:
      labels:
        app: torchserve
    spec:
      volumes:
      # - name: persistent-log-storage
      #   persistentVolumeClaim:
      #     claimName: {{ .Values.pvc.name }}
      - name: config-properties-volume
        configMap:
          name: {{ .Values.configmap.name }}
      
      # initContainers:
      # - name: set-log-volume-permissions
      #   image: busybox:1.36
      #   command: ["/bin/sh", "-c", "chown -R 1000:1000 /logs"]
      #   volumeMounts:
      #   - name: persistent-log-storage
      #     mountPath: /logs
      
      containers:
      - name: torchserve
        image: {{ .Values.torchserve_image }}
        command: ["/bin/bash", "-c"]
        args:
          - |
            # La commande est plus simple car model-store et models sont dans le fichier de config
            torchserve --start \
              --ts-config /home/model-server/config.properties \
              --disable-token-auth \
              --enable-model-api &
            tail -f /dev/null
        
        ports:
        - name: ts
          containerPort: {{ .Values.torchserve.inference_port }}
        - name: ts-management
          containerPort: {{ .Values.torchserve.management_port }}
        
        volumeMounts:
        # - name: persistent-log-storage
        #   mountPath: /home/model-server/shared/logs
        - name: config-properties-volume
          mountPath: /home/model-server/config.properties
          subPath: config.properties

        resources:
          limits:
            cpu: {{ .Values.torchserve.n_cpu }}
            memory: {{ .Values.torchserve.memory_limit }}
          requests:
            cpu: {{ .Values.torchserve.n_cpu }}
            memory: {{ .Values.torchserve.memory_request }}