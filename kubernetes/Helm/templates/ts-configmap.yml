# templates/ts-configmap.yml
apiVersion: v1
kind: ConfigMap
metadata:
  # On utilise le nom défini dans values.yaml
  name: {{ .Values.configmap.name }}
  namespace: {{ .Release.Namespace }}
data:
  # Le nom de la clé (le nom du fichier) est "config.properties"
  config.properties: |
    # This file is dynamically generated by Helm from values.yaml.
    # It allows for easy configuration management.

    # --- Static addresses, built from the 'torchserve' section in values.yaml ---
    inference_address=http://0.0.0.0:{{ .Values.torchserve.inference_port }}
    management_address=http://0.0.0.0:{{ .Values.torchserve.management_port }}

    # --- Loop through all key-value pairs defined in 'configmap.data' ---
    # This automatically adds all the other settings to the file.
    {{- range $key, $value := .Values.configmap.data }}
    {{ $key }}={{ $value }}
    {{- end }}